# AiBaby - GRPO-tuned training configuration
# Larger group size for more stable group-relative advantages + annealed
# exploration noise, sized to favor the no-critic GRPO update.
seed: 0
device: auto              # auto | cpu | cuda | mps
run_dir: runs/grpo_tuned  # TensorBoard logs + checkpoints
checkpoint_every: 20      # save a checkpoint every N training iterations
resume: null              # path to a checkpoint to resume from, or null

# --- World ---------------------------------------------------------------
world:
  num_food: [18, 25]
  num_hazard: [4, 8]
  num_wall: [2, 6]
  initial_energy: 100.0
  energy_per_timestep: 0.25
  food_reward: 10.0
  food_energy: 20.0
  hazard_penalty: -15.0
  max_steps: 200

# --- Model (small Transformer, random init) ------------------------------
model:
  d_model: 64
  n_heads: 4
  n_layers: 3
  max_seq: 512
  drop_emb: 0.0

# --- GRPO (no critic) ------------------------------------------------------
grpo:
  entropy_coef: 0.01
  lr: 0.0002
  max_grad_norm: 0.5
  num_epochs: 4
  batch_size: 256
  group_size: 12
  exploration_noise: 0.1   # annealed 0.995x per iter in the training loop

# --- Training schedule ----------------------------------------------------
train:
  total_iters: 200
  eval_every: 20
  eval_episodes: 40

# --- Curriculum -----------------------------------------------------------
curriculum:
  start_difficulty: 0.1
  end_difficulty: 0.9
  success_step: 0.05
  fail_step: 0.02
  success_threshold: 12.0
  eval_episodes: 24
